timezones:
  display: Africa/Algiers
  market: America/New_York
trading_windows_algiers:      # tes kill zones
  - {name: trade1, start: "15:30", end: "17:00"}
  - {name: trade2, start: "17:00", end: "18:30"}
snapshots_algiers: ["13:00", "14:45"]
snapshots_ny: ["08:00", "09:45", "15:45"]
rules:
  max_trades_per_day: 2
  cancel_trade2_if_trade1_loss: true
  cooldown_after_sl_minutes: 15
  daily_loss_limit_r: 2.0
  tilt:
    vengeance_minutes: 30
    size_multiplier_threshold: 1.5
    frequency_max_trades: 3
    frequency_window_minutes: 45
risk:
  instrument: MNQ            # MNQ ($2/pt) ou NQ ($20/pt)
  risk_per_trade_pct: 0.5
  account_size: 0            # renseigne ton compte ou la taille prop
  point_values:
    NQ: 20.0
    MNQ: 2.0
  prop_profile: {max_daily_loss: 0, trailing_drawdown: 0}
events:
  post_event_buffer_minutes: 90     # volatilité résiduelle après un événement Tier 1
  stand_aside_before_minutes: 5
  wait_after_minutes: 3
  tier1: [FOMC, CPI, NFP, PCE, "FOMC Minutes", "Powell", "GDP"]
  tier2: [PPI, JOLTS, "Retail Sales", "Consumer Sentiment", "ISM", "ISM Services", "ISM Manufacturing", "ADP", "Average Hourly Earnings", "Unemployment Rate"]
  megacaps: [NVDA, MSFT, AAPL, AMZN, GOOGL, META, AVGO, TSLA]
  horizon_days: 14
  cache_ttl_hours: 6
  sources:
    fed_rss: "https://www.federalreserve.gov/feeds/press_all.xml"
    fed_fomc_calendar: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
    bls_schedule_base: "https://www.bls.gov/schedule/news_release"
    bea_schedule: "https://www.bea.gov/news/schedule"
    ism_schedule: "https://www.ismworld.org/supply-management-news-and-reports/reports/ism-report-on-business/"
    forexfactory_thisweek: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
    forexfactory_nextweek: "https://nfs.faireconomy.media/ff_calendar_nextweek.json"
    fred_release_ids:
      CPI: 10
      PPI: 46
      NFP: 50
      GDP: 53
      PCE: 54
  fomc_minutes_lag_weeks: 3
levels:
  wall_proximity_points: 40   # seuil "coincé entre deux murs"
  stale_data_minutes: 30
  spot_max_age_minutes: 20.0  # seuil d'âge max pour le spot NQ pendant les heures de cotation CME
  cboe_max_median_delay_minutes: 30.0 # seuil max de retard médian sur les options CBOE
  wall_window_pct: 0.03       # fenêtre de recherche des murs utiles autour du spot (±3 %)
  straddle_max_spread_pct: 0.20 # largeur relative (ask-bid)/mid max tolérée sur Call/Put ATM
  target_tolerance_minutes: 15.0 # tolérance max d'écart à 16:00 ET pour la séance précédente (minutes)
  straddle_max_discrepancy_pct: 25.0 # divergence max tolérée entre méthode IV et méthode Straddle (%)
validation:
  min_sessions: 60
  min_event_samples: 12
macro:
  percentile_lookback_days: 252
  delta_lookback_days: 5
  sources:
    us10y_fred: "DGS10"
    us2y_fred: "DGS2"
    dxy_symbol: "DX-Y.NYB"
    dxy_fallback_fred: "DTWEXBGS"
    vix_symbol: "^VIX"
    vxn_symbol: "^VXN"
    nq_symbol: "NQ=F"
    cot_url: "https://www.cftc.gov/dea/newcot/FinFutFutures.txt"
    cot_contract_name: "NASDAQ-100 CONSOLIDATED - CHICAGO MERCANTILE EXCHANGE"
forecast:
  min_calibration_sessions: 60
  target_coverage_1sigma: 0.6827
  confidence_level: 0.95
  day_types:
    range:
      max_range_to_expected_move: 0.85
      description: "Journée comprimée (range réel <= 0.85 * expected move)"
    trend:
      min_abs_change_to_range: 0.60
      description: "Journée directionnelle (|clôture - ouverture| >= 0.60 * range)"
    volatile:
      min_range_to_expected_move: 1.15
      description: "Journée expansive (range réel >= 1.15 * expected move)"
sources:
  bls_contact_email: "contact@nqcockpit.local"
  stale_data_threshold_minutes: 60
  cboe_ndx_url: "https://cdn.cboe.com/api/global/delayed_quotes/options/_NDX.json"
market_sessions:
  us_equities:
    timezone: America/New_York
    open: "09:30"
    close: "16:00"
    trading_days: [0, 1, 2, 3, 4]
    symbols: ["^NDX", "^VIX", "^VXN", "CBOE NDX Options"]
  cme_futures:
    timezone: America/New_York
    open_sunday: "18:00"
    close_friday: "17:00"
    daily_halt_start: "17:00"
    daily_halt_end: "18:00"
    symbols: ["NQ=F"]
  cboe_options:
    timezone: America/New_York
    open: "09:30"
    close: "16:15"
    trading_days: [0, 1, 2, 3, 4]
    symbols: ["CBOE NDX Options"]
data:
  db_path: "data/nqcockpit.db"
  cache_dir: "data/cache"
  backup_dir: "data/backups"
  backup_retention_days: 30
  intraday_intervals: ["1m", "5m"]
  basis_max_drift_seconds: 60
  stale_bar_threshold_minutes: 15
  symbols_expected_delay_minutes:
    "NQ=F": 15
  delay_margin_minutes: 10
  parity_basis_tolerance_points: 50.0
  target_tolerance_minutes: 15.0

briefing:
  gemini_model: "gemini-2.5-flash"



