[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nqcockpit"
version = "0.1.0"
description = "Cockpit local de préparation, discipline et mesure pour le trading NQ"
readme = "README-START-HERE.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyarrow>=12.0.0",
    "requests>=2.28.0",
    "yfinance>=0.2.30",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "APScheduler>=3.10.0",
    "plotly>=5.15.0",
    "cot_reports>=0.1.3",
    "pandas_market_calendars>=4.3.0",
    "tzdata>=2023.3",
    "pywebview>=4.0.0",
    "MetaTrader5>=5.0.0; sys_platform == 'win32'",
]

[project.scripts]
nqcockpit = "nqcockpit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor", ".venv"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "vendor",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

